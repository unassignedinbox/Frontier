<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>FRONTIER — Flow Racing Prototype</title>
    <link rel="stylesheet" href="/src/ui/hud.css" />
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #04050a; overflow: hidden;
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #boot {
        position: fixed; inset: 0; display: grid; place-content: center;
        gap: 10px; text-align: center; z-index: 50; background: #04050a;
        letter-spacing: .22em; font-size: 12px; color: #6fe3ff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><div>INITIALISING FLOW CORE</div><div id="boot-detail" style="color:#3d5a70">building corridor…</div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
