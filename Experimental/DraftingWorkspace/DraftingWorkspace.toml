# DraftingWorkspace options (read by DraftingWorkspaceHost from the working directory, or --options PATH).
# Every key is optional; the values below are the defaults.

[Window]
Width = 1600
Height = 900

[Viewport]
EdgeStroke = 1.5                 # px
Grid = true
Orthographic = false
FieldOfView = 0.7                # rad, vertical

[Interface]
FontPath = ""                    # empty: EngineContent/FontArchives/DM Sans/DMSans-Regular.ttf
FontSize = 15.0                  # px

[Files]
RecoveryPath = "_ClaudeScratch/autosave/DraftingWorkspace.drafting.toml"
AutosaveDelay = 0.6              # s of quiet time before an autosave
DocumentPath = "Bracket.drafting.toml"

[Vulkan]
DriverPath = ""                  # empty: system loader; or an ICD library such as libvk_swiftshader.so
Validation = false
