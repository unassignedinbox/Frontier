<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lattice Reach — standalone prototype</title>
<link rel="stylesheet" href="/Documentation/Prototypes/_shared/prototype.css" />
<style>
/*--------------------------------------------------------------------------------------------------------------
  Lattice Reach — two readings and one control. Calm pass: the dot field is gone, the arc stays quiet,
  and the only control is the sweep over the size spread.
--------------------------------------------------------------------------------------------------------------*/
.deck { width: 470px; margin: 0 auto; padding: 28px 0 40px; }
.card {
    border-radius: 22px; padding: 20px 20px 18px;
    background: linear-gradient(178deg, #141618 0%, #101214 60%, #0E1012 100%);
    border: 1px solid rgba(255, 255, 255, 0.07);
    box-shadow: 0 30px 60px -34px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
.head { display: flex; align-items: center; gap: 8px; }
.head .name { font-size: 10px; font-weight: 500; letter-spacing: 1.4px; text-transform: uppercase;
              color: #6E747A; }
.head .pill { margin-left: auto; height: 23px; display: inline-flex; align-items: center; gap: 6px;
              padding: 0 10px 0 9px; border-radius: 999px; font-size: 10px; letter-spacing: 0.4px;
              color: #D5E2B0; border: 1px solid rgba(216, 238, 102, 0.2);
              background: rgba(216, 238, 102, 0.05); }
.head .pill i { width: 5px; height: 5px; border-radius: 50%; background: #D8EE66; }
h1 { margin: 12px 0 0; font-size: 25px; font-weight: 300; letter-spacing: -0.6px; color: #F4F5F2; }
h1 small { font-size: 11px; font-weight: 400; color: #6E747A; margin-left: 9px; }

.num { display: inline-flex; align-items: baseline; font-variant-numeric: tabular-nums; }
.num b { font-weight: 300; color: #F2F3F0; }
.num i { font-style: normal; font-weight: 300; color: #7E848A; }
.num em { font-style: normal; font-size: 0.5em; letter-spacing: 0.3px; color: #646A70; margin-left: 3px; }

.top { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 16px; align-items: center;
       margin-top: 18px; }
.ring { position: relative; }
.ring svg { display: block; width: 100%; height: auto; }
.ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 1px; pointer-events: none; }
.ring .mid .num { font-size: 17px; letter-spacing: -0.4px; }
.ring .mid small { font-size: 8.5px; letter-spacing: 1px; text-transform: uppercase; color: #5C6167; }

.ledger { display: flex; flex-direction: column; gap: 8px; }
.ledger div { display: flex; align-items: baseline; gap: 10px; }
.ledger span { font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; color: #6E747A; }
.ledger .num { margin-left: auto; font-size: 15px; letter-spacing: -0.2px; }

.section { margin-top: 20px; }
.section-head { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
.section-head .mark { width: 5px; height: 5px; border-radius: 50%; background: #F26430; }
.section-head h2 { margin: 0; font-size: 9.5px; font-weight: 500; letter-spacing: 1.4px;
                   text-transform: uppercase; color: #8A9096; }
.section-head .tail { margin-left: auto; font-size: 10px; color: #5C6167; }

.sweep-shell { border-radius: 15px; background: #0D0F11; border: 1px solid rgba(255, 255, 255, 0.05);
               padding: 12px 13px 9px; }
.sweep-shell svg { display: block; width: 100%; height: 84px; cursor: ew-resize; touch-action: none;
                   outline: none; }
.sweep-shell svg:focus-visible { outline: 1px solid rgba(216, 238, 102, 0.45); outline-offset: 3px;
                                 border-radius: 10px; }
.sweep-cap { display: flex; justify-content: space-between; font-size: 8px; letter-spacing: 0.8px;
             color: #454B51; text-transform: uppercase; margin-top: 4px; }
.read { display: flex; align-items: center; gap: 7px; margin-top: 11px; }
.read .chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px;
              border-radius: 7px; font-size: 10px; color: #A9B0B6;
              border: 1px solid rgba(255, 255, 255, 0.07); background: rgba(255, 255, 255, 0.025);
              font-variant-numeric: tabular-nums; }
.read .chip b { font-weight: 500; color: #E4E7E1; }
.read .chip i { width: 5px; height: 5px; border-radius: 50%; background: #D8EE66; }
.read .chip.coral i { background: #F26430; }
.read .note { margin-left: auto; font-size: 9.5px; color: #4E545A; }

.callout { position: relative; margin-top: 16px; padding: 10px 12px 10px 14px; border-radius: 12px;
           font-size: 10.5px; line-height: 1.5; color: #A9CDB6;
           background: rgba(93, 242, 155, 0.05); border: 1px solid rgba(93, 242, 155, 0.13); }
.callout::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px;
                   border-radius: 2px; background: #5DF29B; }
.callout b { font-weight: 500; color: #E3EFDD; }
.callout.warn { color: #DCB4A2; background: rgba(242, 100, 48, 0.07);
                border-color: rgba(242, 100, 48, 0.15); }
.callout.warn::before { background: #F26430; }
.callout.warn b { color: #FFDCCB; }

.meta { width: 470px; margin: 0 auto 18px; display: flex; align-items: center; gap: 9px; font-size: 10px;
        color: #4E545A; }
.meta b { color: #8A9096; font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase;
          font-size: 9.5px; }
.meta .dot { width: 3px; height: 3px; border-radius: 50%; background: #3A4046; }
</style>
</head>
<body>
<div class="deck">
<div class="meta"><b>Prototype</b><span class="dot"></span>Lattice Reach<span class="dot"></span>served from the local prototype server</div>

<article class="card" id="Deck">
    <div class="head">
        <span class="name">Lattice Reach</span>
        <span class="pill"><i></i>Dense</span>
    </div>
    <h1>Stone Plinth<small>ground prop</small></h1>

    <div class="top">
        <div class="ring">
            <svg id="Ring" viewBox="0 0 116 116" role="img" aria-label="Face budget used"></svg>
            <div class="mid"><span class="num" id="RingNum"></span><small>budget</small></div>
        </div>
        <div class="ledger">
            <div><span>Corners</span><span class="num" id="Corners"></span></div>
            <div><span>Faces</span><span class="num" id="Faces"></span></div>
            <div><span>Pieces</span><span class="num" id="Pieces"></span></div>
            <div><span>Packed</span><span class="num" id="Packed"></span></div>
        </div>
    </div>

    <section class="section">
        <div class="section-head">
            <span class="mark"></span><h2>Size spread</h2>
            <span class="tail">faces per piece</span>
        </div>
        <div class="sweep-shell">
            <svg id="Sweep" viewBox="0 0 300 84" preserveAspectRatio="none" role="slider" tabindex="0"
                 aria-label="Size spread: drag either edge" aria-valuemin="16" aria-valuemax="512"
                 aria-valuenow="180"><g id="SweepArt"></g></svg>
            <div class="sweep-cap"><span>16 faces</span><span>512 faces</span></div>
        </div>
        <div class="read">
            <span class="chip"><i></i><b id="InRange">0</b> pieces</span>
            <span class="chip coral"><i></i>reweld below <b id="Floor">0</b></span>
            <span class="note">drag an edge</span>
        </div>
        <div class="callout" id="Callout"></div>
    </section>
</article>
</div>

<script>
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
    const node = document.createElementNS(SVGNS, tag);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const writeNum = (node, value, unit, digits = 0) => {
    const [whole, dec] = Number(value).toFixed(digits).split('.');
    node.innerHTML = `<b>${Number(whole).toLocaleString('en-US')}</b>`
        + `${dec ? `<i>.${dec}</i>` : ''}${unit ? `<em>${unit}</em>` : ''}`;
};

const RECORD = { budget: 0.42, corners: 21480, faces: 13740, pieces: 168, packed: 318 };
const DEFAULTS = { sweep: [0.34, 0.72] };
const state = { sweep: [...DEFAULTS.sweep] };

/*------------------------------------------------------------------------- budget arc */
function paintRing() {
    const host = document.getElementById('Ring');
    host.innerHTML = '';
    const c = 58;
    const radius = 46;
    const circ = 2 * Math.PI * radius;
    el('circle', { cx: c, cy: c, r: radius, fill: 'none', stroke: 'rgba(255,255,255,0.055)',
        'stroke-width': 6 }, host);
    // one segment per 10% of the budget: filled where the shape has spent it
    for (let i = 0; i < 10; i += 1) {
        const from = (i / 10) * circ + 2;
        const to = ((i + 1) / 10) * circ - 2;
        el('circle', { cx: c, cy: c, r: radius, fill: 'none',
            stroke: i / 10 < RECORD.budget ? '#D8EE66' : 'rgba(255,255,255,0.07)',
            'stroke-width': 6, 'stroke-linecap': 'butt',
            'stroke-dasharray': `${(to - from).toFixed(1)} ${circ}`,
            'stroke-dashoffset': `${(-from).toFixed(1)}`,
            transform: `rotate(-90 ${c} ${c})` }, host);
    }
    writeNum(document.getElementById('RingNum'), Math.round(RECORD.budget * 100), '%');
    writeNum(document.getElementById('Corners'), RECORD.corners);
    writeNum(document.getElementById('Faces'), RECORD.faces);
    writeNum(document.getElementById('Pieces'), RECORD.pieces);
    writeNum(document.getElementById('Packed'), RECORD.packed, 'KB');
}

/*------------------------------------------------------------------------- sweep */
const BINS = Array.from({ length: 20 }, (_, i) => {
    const t = i / 19;
    return 0.22 + Math.exp(-Math.pow((t - 0.44) / 0.26, 2)) * 0.7 + ((i * 7) % 5) / 90;
});
const FACES_LOW = 16;
const FACES_HIGH = 512;
const sweepSvg = document.getElementById('Sweep');
const sweepArt = document.getElementById('SweepArt');

function paintSweep() {
    sweepArt.innerHTML = '';
    const [from, to] = state.sweep;
    const width = 300;
    const height = 84;
    const base = height - 10;

    el('rect', { x: from * width, y: 4, width: (to - from) * width, height: base - 4,
        fill: 'rgba(216,238,102,0.045)' }, sweepArt);

    const step = width / BINS.length;
    BINS.forEach((value, i) => {
        const inside = (i + 0.5) / BINS.length >= from && (i + 0.5) / BINS.length <= to;
        const barHeight = value * (base - 8);
        el('rect', { x: i * step + step * 0.24, y: base - barHeight, width: step * 0.52,
            height: barHeight, rx: 1.2,
            fill: inside ? 'rgba(216,238,102,0.55)' : 'rgba(255,255,255,0.1)' }, sweepArt);
    });

    el('line', { x1: 0, y1: base, x2: width, y2: base, stroke: 'rgba(255,255,255,0.1)' }, sweepArt);

    // the two edges are the only handles, so they are the only strong marks
    [from, to].forEach((edge, index) => {
        const x = edge * width;
        el('line', { x1: x, y1: 2, x2: x, y2: base + 2, stroke: '#D8EE66', 'stroke-width': 1.1 }, sweepArt);
        el('rect', { x: x - 3, y: base + 3, width: 6, height: 4.4, rx: 1.6,
            fill: index === 0 ? '#D8EE66' : 'rgba(216,238,102,0.65)' }, sweepArt);
    });

    // reweld floor rides the left edge
    const floorX = from * width;
    el('path', { d: `M ${floorX - 2.6} ${base - 1} L ${floorX} ${base - 5} L ${floorX + 2.6} ${base - 1}`,
        fill: 'none', stroke: '#F26430', 'stroke-width': 1.1, 'stroke-linejoin': 'round' }, sweepArt);

    const inside = BINS.filter((_, i) => (i + 0.5) / BINS.length >= from && (i + 0.5) / BINS.length <= to);
    const pieces = Math.round((inside.length / BINS.length) * RECORD.pieces);
    const floor = Math.round(FACES_LOW + from * (FACES_HIGH - FACES_LOW));
    document.getElementById('InRange').textContent = pieces;
    document.getElementById('Floor').textContent = floor;
    sweepSvg.setAttribute('aria-valuenow', floor);

    const share = pieces / RECORD.pieces;
    const node = document.getElementById('Callout');
    node.className = share > 0.8 ? 'callout warn' : 'callout';
    node.innerHTML = share > 0.8
        ? `<b>${Math.round(share * 100)}% of the shape is inside the range</b> — nearly every piece merges `
          + `into its neighbour and the split saves nothing.`
        : `<b>${Math.round(share * 100)}% of the shape is inside the range</b> — ${pieces} pieces held, `
          + `${RECORD.pieces - pieces} collapsed into neighbours.`;
}

const localX = (evt) => {
    const box = sweepSvg.getBoundingClientRect();
    return clamp((evt.clientX - box.left) / box.width, 0, 1);
};
let grab = 'from';
sweepSvg.addEventListener('pointerdown', (evt) => {
    sweepSvg.setPointerCapture(evt.pointerId);
    const [from, to] = state.sweep;
    const x = localX(evt);
    grab = Math.abs(x - from) <= Math.abs(x - to) ? 'from' : 'to';
    sweepDrag(evt);
});
sweepSvg.addEventListener('pointermove', (evt) => {
    if (sweepSvg.hasPointerCapture(evt.pointerId)) sweepDrag(evt);
});
sweepSvg.addEventListener('keydown', (evt) => {
    const dir = evt.key === 'ArrowRight' ? 1 : evt.key === 'ArrowLeft' ? -1 : 0;
    if (!dir) return;
    evt.preventDefault();
    const step = dir * (evt.shiftKey ? 0.1 : 0.02);
    const [from, to] = state.sweep;
    state.sweep = [from, clamp(to + step, from + 0.05, 1)];
    paintSweep();
});
function sweepDrag(evt) {
    const x = localX(evt);
    const [from, to] = state.sweep;
    state.sweep = grab === 'from'
        ? [clamp(x, 0, to - 0.05), to]
        : [from, clamp(x, from + 0.05, 1)];
    paintSweep();
}

paintRing();
paintSweep();
</script>
</body>
</html>
