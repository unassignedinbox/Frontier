name: Everest C++ binaries

on:
  push:
    branches:
      - main
      - arena/0b4c5376-frontier
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GLFW build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libgl1-mesa-dev xvfb xauth imagemagick

      - name: Configure CMake
        run: cmake -S Frontier -B build -DCMAKE_BUILD_TYPE=Release -DFRONTIER_ENABLE_GLFW=ON

      - name: Build Everest and validation
        run: cmake --build build --config Release --parallel 2

      - name: Run C++ validation
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Capture actual Lobby startup window (Linux SwiftShader)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        shell: bash
        run: |
          export FRONTIER_VULKAN_DRIVER="$PWD/Experimental/VehicleHmiPrototype/Tools/.swiftshader/libvulkan.so.1"
          xvfb-run -a node Experimental/VehicleHmiPrototype/Tools/RunOnSoftwareGpu.mjs \
            ./build/EverestWindow --content EngineContent --capture lobby-startup.ppm
          convert lobby-startup.ppm lobby-startup.png

      - name: Upload actual Lobby startup capture
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Everest-Lobby-startup
          path: lobby-startup.png
          if-no-files-found: error
          retention-days: 30

      - name: Stage standalone test package
        shell: bash
        run: |
          mkdir -p dist/Everest/Archive
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp build/Release/EverestWindow.exe dist/Everest/ProjectEverest.exe
            cat > 'dist/Everest/Launch Project Everest.bat' <<'EOF'
          @echo off
          cd /d "%~dp0"
          echo Starting Project Everest. This can take a while.
          ProjectEverest.exe --archive "%~dp0Archive" --content "%~dp0EngineContent" > "%~dp0Everest-log.txt" 2>&1
          if errorlevel 1 (
            echo.
            echo Project Everest could not start. Details:
            type "%~dp0Everest-log.txt"
            echo.
            echo Please send the contents of Everest-log.txt for help.
            pause
          )
          EOF
            sed -i 's/$/\r/' 'dist/Everest/Launch Project Everest.bat'
          else
            cp build/EverestWindow dist/Everest/ProjectEverest
          fi
          cp Experimental/VehicleHmiPrototype/Archive/ControlVehicleBody.facet dist/Everest/Archive/
          cp Experimental/VehicleHmiPrototype/Archive/ControlVehicleTyre.facet dist/Everest/Archive/
          cp Experimental/VehicleHmiPrototype/Archive/ControlVehicleRim.facet dist/Everest/Archive/
          mkdir -p dist/Everest/EngineContent/ShaderArchives dist/Everest/EngineContent/EnvironmentArchives
          cp -R EngineContent/ShaderArchives/GlobalIllumination dist/Everest/EngineContent/ShaderArchives/
          cp -R EngineContent/EnvironmentArchives/ProvingGround dist/Everest/EngineContent/EnvironmentArchives/
          cp -R EngineContent/EnvironmentArchives/Lobby dist/Everest/EngineContent/EnvironmentArchives/
          cat > dist/Everest/README.txt <<'EOF'
          Project Everest — C++ test build

          Extract the whole ZIP before running. Keep Archive and EngineContent next to the executable.
          Windows: double-click "Launch Project Everest.bat". If startup fails, it stays open and writes Everest-log.txt.
          Linux/macOS: run ./ProjectEverest from a terminal. Linux needs an X11 desktop and OpenGL.

          This is the interactive C++ test build, not the full original JavaScript Lobby UI.
          The Lobby and Proving Grounds use native Vulkan ReSTIR. A Vulkan 1.3 driver is required.
          On macOS a compatible Vulkan/MoltenVK loader must be supplied using FRONTIER_VULKAN_DRIVER.
          The window runtime has been tested on Linux with SwiftShader, but not yet on Windows or macOS.
          Rendering can be slow with a software Vulkan driver.

          Lobby: arrows/D-pad choose, Enter selects; mouse orbits the parked car.
          Proving Grounds: WASD/left stick drive; Esc/start opens routes.
          EOF

      - name: Check packaged asset discovery outside the package directory
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$GITHUB_WORKSPACE/dist/Everest/ProjectEverest.exe" --check-content
          else
            "$GITHUB_WORKSPACE/dist/Everest/ProjectEverest" --check-content
          fi

      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: Everest-${{ runner.os }}
          path: dist/Everest/
          if-no-files-found: error
          retention-days: 30
